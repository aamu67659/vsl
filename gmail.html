<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>google landinge</title>
    <link rel="stylesheet" href="gmailstyle.css"/>
</head>
<body>
   <header class="navbar">
    <div class="logo">
        <img src="assets/gmail logo.png" alt="Gmail Logo" />
    </div>
    <nav class="nav-links">
        <a href="google.com/work">For work</a>
        <a href="google.com/signin">Sign in</a>
        <button class="create-btn">Create an account</button>
    </nav>
</header>

      <main class="main-content">
        <div class="text-area">
            <h1>Secure, smart and 
            <br>easy to use email</h1>
            <p>
            <h5>Get more done with Gmail, Now integrated with Google Chat,
            <br> Google Meet, and more, all in one place.</h5> 
            </p>
            <br>
            <div class="buttons">
                <button class="create-btn">Create an account</button>
                <a href="#">For work</a>
            </div>
        </div>

        <div class="image-area">
            <img src="assets/gmail logo2.jpg" alt="Gmail logo2" />
        </div>
      </main>


    </header>
</body>
</html>
